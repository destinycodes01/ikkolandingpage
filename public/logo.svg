<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Green Flame Gradient -->
    <linearGradient id="logoGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E65B" />
      <stop offset="50%" stop-color="#00AA44" />
      <stop offset="100%" stop-color="#006C2B" />
    </linearGradient>

    <!-- Red Flame Gradient -->
    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B3B" />
      <stop offset="50%" stop-color="#E51010" />
      <stop offset="100%" stop-color="#940000" />
    </linearGradient>
  </defs>

  <!-- Left IK.KO Flame Icon -->
  <g transform="translate(40, 20) scale(0.72)">
    <!-- GREEN FLAME SWIRL -->
    <path
      d="M 270 5 C 270 5 220 35 190 90 C 148 168 185 240 245 292 C 302 342 332 380 305 440 C 278 498 212 518 158 488 C 205 460 238 412 220 360 C 196 295 110 246 130 150 C 146 76 215 28 270 5 Z"
      fill="url(#logoGreenGrad)"
    />

    <!-- RED FLAME SWIRL -->
    <path
      d="M 125 142 C 125 142 62 218 42 295 C 15 398 68 498 172 520 C 222 530 242 512 215 570 C 188 625 125 628 65 582 C 108 558 140 512 125 460 C 102 392 20 328 42 232 C 58 165 102 152 125 142 Z"
      transform="translate(-10, -42) scale(0.86)"
      fill="url(#logoRedGrad)"
    />

    <!-- LOWER RED FLAME TAIL -->
    <path
      d="M 88 368 C 65 420 80 478 122 510 C 98 495 85 468 94 430 C 100 402 128 380 88 368 Z"
      transform="translate(-5, -30) scale(0.92)"
      fill="#E51010"
    />
  </g>

  <!-- Right Brand Name Typography -->
  <g transform="translate(320, 100)">
    <!-- IK.KO text -->
    <text x="0" y="110" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="125" fill="#00AA44" letter-spacing="-2">IK</text>
    <rect x="150" y="85" width="22" height="22" fill="#E51010" rx="2" />
    <text x="188" y="110" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="125" fill="#00AA44" letter-spacing="-2">KO</text>

    <!-- ENERGY LTD text -->
    <text x="0" y="200" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="70" fill="#E51010" letter-spacing="4">ENERGY LTD</text>
  </g>
</svg>

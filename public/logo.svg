<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <!-- Green Flame Gradient -->
    <linearGradient id="logoGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D059" />
      <stop offset="50%" stop-color="#00A843" />
      <stop offset="100%" stop-color="#007A2F" />
    </linearGradient>

    <!-- Red Flame Gradient -->
    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E" />
      <stop offset="50%" stop-color="#E51212" />
      <stop offset="100%" stop-color="#9E0000" />
    </linearGradient>
  </defs>

  <!-- Left Dual Flame Icon -->
  <g transform="translate(30, 20) scale(0.95)">
    <!-- GREEN FLAME SWIRL -->
    <path
      d="M 185,22 C 185,22 135,45 112,95 C 88,145 105,190 148,222 C 182,248 198,272 178,310 C 160,345 120,358 85,338 C 112,320 132,290 120,258 C 105,218 55,188 68,128 C 78,82 122,38 185,22 Z"
      fill="url(#logoGreenGrad)"
    />

    <!-- RED FLAME SWIRL -->
    <path
      d="M 72,112 C 72,112 35,160 22,208 C 5,268 38,328 102,342 C 132,348 145,338 128,375 C 112,410 72,412 35,385 C 62,370 82,342 72,310 C 58,268 8,228 22,170 C 32,128 58,120 72,112 Z"
      fill="url(#logoRedGrad)"
    />

    <!-- LOWER RED FLAME ACCENT TIP -->
    <path
      d="M 52,268 C 38,300 48,335 75,355 C 60,345 52,328 58,305 C 62,288 78,275 52,268 Z"
      fill="#C40D0D"
    />
  </g>

  <!-- Right Typography: IK.KO ENERGY LTD -->
  <g transform="translate(290, 80)">
    <!-- IK.KO text -->
    <text x="0" y="110" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="125" fill="#00A843" letter-spacing="-2">IK</text>
    <rect x="150" y="85" width="22" height="22" fill="#E51212" rx="2" />
    <text x="188" y="110" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="125" fill="#00A843" letter-spacing="-2">KO</text>

    <!-- ENERGY LTD text -->
    <text x="0" y="200" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="70" fill="#E51212" letter-spacing="4">ENERGY LTD</text>
  </g>
</svg>

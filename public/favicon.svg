<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Top Green Flame Gradient -->
    <linearGradient id="gFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D059" />
      <stop offset="50%" stop-color="#00A843" />
      <stop offset="100%" stop-color="#007A2F" />
    </linearGradient>

    <!-- Bottom Red Flame Gradient -->
    <linearGradient id="rFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E" />
      <stop offset="50%" stop-color="#E51212" />
      <stop offset="100%" stop-color="#9E0000" />
    </linearGradient>
  </defs>

  <!-- Clean canvas background for maximum tab contrast -->
  <rect width="512" height="512" rx="110" fill="#FFFFFF" />

  <g transform="translate(68, 36) scale(1.15)">
    <!-- GREEN FLAME SWIRL -->
    <!-- Outer green top tip & ribbon curve -->
    <path
      d="M 185,22 C 185,22 135,45 112,95 C 88,145 105,190 148,222 C 182,248 198,272 178,310 C 160,345 120,358 85,338 C 112,320 132,290 120,258 C 105,218 55,188 68,128 C 78,82 122,38 185,22 Z"
      fill="url(#gFlame)"
    />

    <!-- RED FLAME SWIRL -->
    <!-- Red lower ribbon curve -->
    <path
      d="M 72,112 C 72,112 35,160 22,208 C 5,268 38,328 102,342 C 132,348 145,338 128,375 C 112,410 72,412 35,385 C 62,370 82,342 72,310 C 58,268 8,228 22,170 C 32,128 58,120 72,112 Z"
      fill="url(#rFlame)"
    />

    <!-- LOWER RED FLAME ACCENT TIP -->
    <path
      d="M 52,268 C 38,300 48,335 75,355 C 60,345 52,328 58,305 C 62,288 78,275 52,268 Z"
      fill="#C40D0D"
    />
  </g>
</svg>

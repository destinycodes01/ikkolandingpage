<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Green Flame Gradient -->
    <linearGradient id="greenFlameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="45%" stop-color="#18A84E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Red Flame Gradient -->
    <linearGradient id="redFlameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="45%" stop-color="#DD3F39" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean rounded background badge for maximum visibility in dark & light tabs -->
  <rect width="512" height="512" rx="110" fill="#FFFFFF" />

  <g transform="translate(64, 40) scale(3.8)" filter="url(#subtleGlow)">
    <!-- Outer Green Flame Swirl Ribbon -->
    <path
      d="M 65 8 C 65 8 50 23 45 40 C 40 56 48 70 60 76 C 68 80 72 78 68 86 C 64 94 50 100 38 96 C 28 93 24 80 28 70 C 32 60 42 50 42 36 C 42 20 28 13 28 13 C 28 13 20 26 20 43 C 20 66 32 86 52 96 C 72 106 92 93 90 70 C 88 50 75 30 65 8 Z"
      fill="url(#greenFlameGrad)"
    />

    <!-- Inner Red Flame Swirl Ribbon -->
    <path
      d="M 28 33 C 28 33 15 48 12 66 C 9 83 20 100 38 106 C 48 110 55 108 50 114 C 44 120 28 120 18 112 C 8 104 2 88 8 73 C 14 58 28 46 28 33 Z"
      fill="url(#redFlameGrad)"
    />
    
    <!-- Lower Red Flame Accent Curve -->
    <path
      d="M 25 78 C 22 86 24 94 32 100 C 38 104 42 103 38 107 C 32 111 20 108 14 100 C 8 90 12 80 25 78 Z"
      fill="#B91C1C"
    />
  </g>
</svg>
